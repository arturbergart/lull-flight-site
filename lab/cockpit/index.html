<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow"><title>Lull · Кабина пилота</title>
<style>
  html,body{margin:0;height:100%;background:#f4f1ea;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#141414}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 14px);text-align:center;pointer-events:none}
  .top .k{font-size:10px;letter-spacing:.32em;text-transform:uppercase;opacity:.75}
  .top .t{font-size:13px;margin-top:4px;opacity:.9}
  .bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;gap:10px;justify-content:center;padding:0 16px}
  button{font:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;border-radius:999px;padding:13px 18px;border:1px solid #141414;background:rgba(244,241,234,.92);color:#141414;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  button.dark{background:#141414;color:#f4f1ea}
  .hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translateX(-50%);font-size:12px;background:rgba(244,241,234,.9);padding:8px 14px;border-radius:999px;white-space:nowrap;transition:opacity .6s}
  .err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:15px;line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><div class="k">Lull · кабина пилота</div><div class="t">Над облаками · 11 000 м</div></div>
<div class="hint" id="hint">Тяните пальцем, чтобы осмотреться</div>
<div class="bar"><button class="dark" id="gyro">Поворот телефоном</button><button id="center">По центру</button></div>
<div class="err" id="err">Этот браузер не умеет показывать 3D-сцену.</div>
<script>
"use strict";
const D2R=Math.PI/180;
/* ---------- cockpit picture: a 360° panorama painted on a canvas ----------
   x = longitude (0 = straight ahead, + = right), y = latitude (+ = up).
   Windows are cut out, so the live sky shows through them. */
function paintCockpit(){
  const W=4096,H=2048,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const X=lon=>(0.5+lon/360)*W, Y=lat=>(0.5-lat/180)*H;
  const poly=(pts)=>{g.beginPath();pts.forEach(([lo,la],i)=>i?g.lineTo(X(lo),Y(la)):g.moveTo(X(lo),Y(la)));g.closePath()};
  const rect=(lo1,la1,lo2,la2)=>poly([[lo1,la1],[lo2,la1],[lo2,la2],[lo1,la2]]);
  const INK='#141414',PAPER='#f4f1ea',P2='#ece8df',P3='#e2ddd2';
  const shape=(fill,lw)=>{g.fillStyle=fill;g.fill();g.strokeStyle=INK;g.lineWidth=lw||2.5;g.stroke()};
  const line=(pts,lw)=>{g.beginPath();pts.forEach(([lo,la],i)=>i?g.lineTo(X(lo),Y(la)):g.moveTo(X(lo),Y(la)));g.strokeStyle=INK;g.lineWidth=lw||2;g.stroke()};
  // paper walls, a soft shade toward the floor
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,P2);gr.addColorStop(.4,PAPER);gr.addColorStop(.7,P2);gr.addColorStop(1,'#cfcac0');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // ceiling seams
  for(const lo of [-110,-40,40,110])line([[lo,80],[lo*0.55,34]],1.5);
  // back wall: door
  rect(146,36,174,-64);shape(PAPER,3);line([[149,33],[171,33],[171,-61],[149,-61],[149,33]],1.2);
  g.beginPath();g.arc(X(151.5),Y(-12),9,0,7);shape(PAPER,2.5);rect(155,26,165,16);shape(P3,2);
  // overhead panel: outlined switches, one row of small lights
  poly([[-34,30],[34,30],[26,78],[-26,78]]);shape(P2,3);
  for(let r=0;r<7;r++){const la=35+r*5.6,half=31-r*0.9;line([[-half,la-2],[half,la-2]],1);
    for(let c=-half+3;c<half-2;c+=4.2){const on=((r*7+c*3)|0)%5===0;g.beginPath();g.rect(X(c)-9,Y(la)-12,18,22);
      g.fillStyle=on?INK:PAPER;g.fill();g.strokeStyle=INK;g.lineWidth=2;g.stroke()}}
  g.font='500 21px Helvetica,Arial';g.fillStyle=INK;g.textAlign='center';
  [['ELEC',-20],['HYD',-7],['FUEL',7],['AIR',20]].forEach(([t,a])=>g.fillText(t,X(a),Y(32.2)));
  // glareshield: one black band, the autopilot window in it
  poly([[-62,-9],[62,-9],[60,-19],[-60,-19]]);shape(INK,2);
  rect(-14,-11.2,14,-16.8);g.strokeStyle=PAPER;g.lineWidth=2;g.stroke();
  g.font='20px Menlo,monospace';g.fillStyle=PAPER;[['SPD 250',-9],['HDG 112',0],['FL 360',9]].forEach(([t,a])=>g.fillText(t,X(a),Y(-14.6)));
  // main panel
  poly([[-60,-19],[60,-19],[56,-52],[-56,-52]]);shape(P2,2.5);
  const scr=(a,b)=>{rect(a,-22,b,-44);shape(INK,3)};
  const W2=PAPER;
  // captain PFD: horizon as a single line, the plane as an ink-white mark
  scr(-46,-27);{const cx=X(-36.5),cy=Y(-32);g.strokeStyle=W2;g.lineWidth=2.5;
    g.beginPath();g.moveTo(X(-41),cy);g.lineTo(X(-32),cy);g.stroke();
    g.lineWidth=1.5;for(const k of [-2,-1,1,2]){g.beginPath();g.moveTo(cx-(k%2?36:60),cy-k*30);g.lineTo(cx+(k%2?36:60),cy-k*30);g.stroke()}
    g.lineWidth=5;g.beginPath();g.moveTo(cx-80,cy);g.lineTo(cx-30,cy);g.lineTo(cx-30,cy+16);g.moveTo(cx+80,cy);g.lineTo(cx+30,cy);g.lineTo(cx+30,cy+16);g.stroke();
    g.lineWidth=1.5;g.strokeRect(X(-45.3),Y(-24),40,Y(-42)-Y(-24));g.strokeRect(X(-28.2)-40,Y(-24),40,Y(-42)-Y(-24));
    g.font='19px Menlo,monospace';g.fillStyle=W2;g.fillText('250',X(-45.3)+20,cy+7);g.fillText('360',X(-28.2)-20,cy+7)}
  // map: arc, route as a fine dashed line
  scr(-24,-5);{const cx=X(-14.5),cy=Y(-41);g.save();g.beginPath();g.rect(X(-24),Y(-22),X(-5)-X(-24),Y(-44)-Y(-22));g.clip();
    g.strokeStyle=W2;g.lineWidth=2;g.beginPath();g.arc(cx,cy,190,Math.PI*1.18,Math.PI*1.82);g.stroke();
    g.setLineDash([10,8]);g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+30,cy-160);g.lineTo(cx+80,cy-290);g.stroke();g.setLineDash([]);
    g.beginPath();g.arc(cx+80,cy-290,7,0,7);g.stroke();g.fillStyle=W2;g.font='19px Menlo,monospace';g.fillText('TLV',cx+125,cy-284);
    g.beginPath();g.moveTo(cx,cy-18);g.lineTo(cx-13,cy+10);g.lineTo(cx+13,cy+10);g.closePath();g.fill();
    g.fillText('GS 482   TAS 470',cx,Y(-24.2));g.restore()}
  // engines: two thin gauges
  scr(5,24);{g.strokeStyle=W2;g.lineWidth=2;
    [10.5,18.5].forEach(a=>{const cx=X(a),cy=Y(-29.5);g.beginPath();g.arc(cx,cy,60,Math.PI*.8,Math.PI*2.2);g.stroke();g.lineWidth=4;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+44,cy-36);g.stroke();g.lineWidth=2});
    g.fillStyle=W2;g.font='19px Menlo,monospace';g.fillText('N1  84.2   84.1',X(14.5),Y(-37.2));g.fillText('FUEL 21.4 T',X(14.5),Y(-41))}
  // first officer PFD
  scr(27,46);{const cy=Y(-32);g.strokeStyle=W2;g.lineWidth=2.5;g.beginPath();g.moveTo(X(31),cy);g.lineTo(X(42),cy);g.stroke();
    g.lineWidth=5;const cx=X(36.5);g.beginPath();g.moveTo(cx-70,cy);g.lineTo(cx-26,cy);g.moveTo(cx+70,cy);g.lineTo(cx+26,cy);g.stroke()}
  // pedestal, two thrust levers
  poly([[-14,-50],[14,-50],[18,-80],[-18,-80]]);shape(P3,2.5);
  [-5,5].forEach(a=>{rect(a-0.8,-52,a+0.8,-62);shape(PAPER,2);rect(a-3.4,-50.8,a+3.4,-54.4);shape(INK,2)});
  rect(-11,-66,11,-74);shape(INK,2);g.fillStyle=PAPER;g.font='17px Menlo,monospace';g.fillText('FMS   DIR   PROG',X(0),Y(-69.8));
  for(let k=0;k<6;k++){g.beginPath();g.rect(X(-9+k*3.6)-12,Y(-76)-9,24,18);g.strokeStyle=INK;g.lineWidth=1.5;g.stroke()}
  // side consoles, sidesticks
  poly([[-64,-24],[-104,-24],[-100,-62],[-60,-58]]);shape(P3,2.5);poly([[64,-24],[104,-24],[100,-62],[60,-58]]);shape(P3,2.5);
  [-70,70].forEach(a=>{g.beginPath();g.ellipse(X(a),Y(-38),46,30,0,0,7);shape(PAPER,2.5);
    g.beginPath();g.rect(X(a)-22,Y(-26),44,Y(-37)-Y(-26));shape(INK,2)});
  // the empty seat on the right: outline only
  g.beginPath();g.roundRect?g.roundRect(X(78),Y(14),X(104)-X(78),Y(-30)-Y(14),46):g.rect(X(78),Y(14),X(104)-X(78),Y(-30)-Y(14));shape(P2,3);
  g.beginPath();g.roundRect?g.roundRect(X(83),Y(23),X(99)-X(83),Y(15)-Y(23),30):g.rect(X(83),Y(23),X(99)-X(83),Y(15)-Y(23));shape(P2,3);
  line([[91,10],[91,-24]],1.5);
  // floor
  gr=g.createLinearGradient(0,Y(-74),0,H);gr.addColorStop(0,'#d9d4c9');gr.addColorStop(1,'#b9b4aa');g.fillStyle=gr;g.fillRect(0,Y(-80),W,H);
  line([[-180,-80],[180,-80]],2);
  // windows: cut out, then a double ink frame
  const wins=[
    [[-25,24],[-2.2,26],[-2.2,-9],[-27,-8]],[[2.2,26],[25,24],[27,-8],[2.2,-9]],
    [[-30,22],[-57,15],[-58,-6],[-32,-8]],[[30,22],[57,15],[58,-6],[32,-8]],
    [[-63,13],[-92,9],[-93,-4],[-64,-6]],[[63,13],[92,9],[93,-4],[64,-6]]];
  g.save();g.globalCompositeOperation='destination-out';wins.forEach(w=>{poly(w);g.fill()});g.restore();
  g.strokeStyle=PAPER;g.lineWidth=26;wins.forEach(w=>{poly(w);g.stroke()});
  g.strokeStyle=INK;g.lineWidth=3;wins.forEach(w=>{poly(w);g.stroke()});
  g.lineWidth=1.3;wins.forEach(w=>{const c=w.reduce((a,p)=>[a[0]+p[0]/4,a[1]+p[1]/4],[0,0]);poly(w.map(([a,b])=>[c[0]+(a-c[0])*1.07,c[1]+(b-c[1])*1.09]));g.stroke()});
  rect(-2.2,26,2.2,-9);shape(PAPER,3);
  g.beginPath();g.arc(X(0),Y(23),18,0,7);shape(PAPER,2.5);line([[0,24],[0,22]],2);
  return cv;
}
/* ---------- WebGL ---------- */
const cv=document.getElementById('c');
const gl=cv.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:false});
if(!gl){document.getElementById('err').style.display='flex'}
const VS=`attribute vec2 p;varying vec2 v;void main(){v=p;gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;varying vec2 v;
uniform mat3 R;uniform float tanF,asp,T;uniform sampler2D tex;
float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int k=0;k<5;k++){s+=a*n(p);p=p*2.03+vec2(17.1,9.2);a*=.5;}return s;}
const vec3 SUN=normalize(vec3(.55,.07,-.83));
vec3 sky(vec3 d){
  float y=d.y;
  vec3 hor=vec3(.97,.89,.80),mid=vec3(.80,.84,.88),zen=vec3(.50,.62,.74);
  vec3 c=mix(hor,mid,smoothstep(0.,.25,y));c=mix(c,zen,smoothstep(.2,.9,y));
  float s=max(dot(d,SUN),0.);
  c+=vec3(1.,.78,.52)*pow(s,8.)*.35+vec3(1.,.93,.80)*pow(s,900.)*3.;
  // high thin cirrus
  if(y>0.02){vec2 q=d.xz/y*3.;q.x+=T*.004;float ci=fbm(q*vec2(.35,1.6));c=mix(c,vec3(.98,.95,.92),smoothstep(.55,.85,ci)*.45*smoothstep(.02,.2,y));}
  if(y<0.){ // cloud deck below
    float t=-1./y;vec2 P=d.xz*t;P.y-=T*.18;
    float dn=fbm(P*.55);float cov=smoothstep(.38,.62,dn);
    float sh=fbm(P*.55+SUN.xz*.06);float lit=clamp(.5+(dn-sh)*6.,0.,1.);
    vec3 top=mix(vec3(.70,.74,.80),vec3(1.,.95,.88),lit);
    vec3 ground=vec3(.38,.45,.52);
    vec3 cc=mix(ground,top,cov);
    float fog=1.-exp(-t*.045);
    c=mix(cc,hor*.98,fog);
  }
  return c;
}
void main(){
  vec3 d=normalize(R*vec3(v.x*tanF*asp,v.y*tanF,-1.));
  vec3 s=sky(d);
  float u=.5+atan(d.x,-d.z)/6.2831853;float w=acos(clamp(d.y,-1.,1.))/3.1415927;
  vec4 k=texture2D(tex,vec2(u,w));
  float L=dot(s,vec3(.299,.587,.114));vec3 sg=mix(vec3(.08),vec3(.957,.945,.918),clamp((L-.2)*1.22,0.,1.));
  gl_FragColor=vec4(mix(sg,k.rgb,k.a),1.);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
let prog,U={};
if(gl){
  prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ['R','tanF','asp','T','tex'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
  const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,paintCockpit());
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.uniform1i(U.tex,0);
}

/* ---------- looking around: quaternions ---------- */
const qmul=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
const qax=(x,y,z,a)=>{const s=Math.sin(a/2);return[x*s,y*s,z*s,Math.cos(a/2)]};
function qEulerYXZ(x,y,z){const c1=Math.cos(x/2),c2=Math.cos(y/2),c3=Math.cos(z/2),s1=Math.sin(x/2),s2=Math.sin(y/2),s3=Math.sin(z/2);
  return[s1*c2*c3+c1*s2*s3,c1*s2*c3-s1*c2*s3,c1*c2*s3-s1*s2*c3,c1*c2*c3+s1*s2*s3]}
function qmat(q){const[x,y,z,w]=q;return new Float32Array([1-2*(y*y+z*z),2*(x*y+z*w),2*(x*z-y*w), 2*(x*y-z*w),1-2*(x*x+z*z),2*(y*z+x*w), 2*(x*z+y*w),2*(y*z-x*w),1-2*(x*x+y*y)])}
const rot=(q,v)=>{const m=qmat(q);return[m[0]*v[0]+m[3]*v[1]+m[6]*v[2],m[1]*v[0]+m[4]*v[1]+m[7]*v[2],m[2]*v[0]+m[5]*v[1]+m[8]*v[2]]};
const Q1=[-Math.SQRT1_2,0,0,Math.SQRT1_2];
let ori=null,gyroOn=false,yawOff=0,dragYaw=0,dragPitch=-4*D2R,needCenter=true,qCur=[0,0,0,1];
function devQ(){const o=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  let q=qEulerYXZ(ori.beta*D2R,ori.alpha*D2R,-ori.gamma*D2R);q=qmul(q,Q1);q=qmul(q,qax(0,0,1,-o*D2R));return q}
function target(){
  if(gyroOn&&ori){let q=devQ();
    if(needCenter){const f=rot(q,[0,0,-1]);yawOff=Math.atan2(f[0],-f[2]);dragYaw=0;needCenter=false}
    return qmul(qax(0,1,0,yawOff-dragYaw),q)}
  return qmul(qax(0,1,0,-dragYaw),qax(1,0,0,dragPitch))}
function slerp(a,b,t){let d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3];if(d<0){b=b.map(x=>-x);d=-d}
  const r=a.map((x,i)=>x+(b[i]-x)*t);const l=Math.hypot(...r);return r.map(x=>x/l)}
window.addEventListener('deviceorientation',e=>{if(e.alpha==null)return;ori={alpha:e.alpha,beta:e.beta,gamma:e.gamma};if(!gyroOn){gyroOn=true;needCenter=true;hint('Поворачивайте телефон')}});
document.getElementById('gyro').onclick=async()=>{
  try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){hint('Без датчиков — тяните пальцем');return}}}catch(e){hint('Без датчиков — тяните пальцем');return}
  setTimeout(()=>{if(!gyroOn)hint('Датчики недоступны — тяните пальцем')},1200)};
document.getElementById('center').onclick=()=>{needCenter=true;dragYaw=0;dragPitch=-4*D2R};
let last=null;
cv.addEventListener('pointerdown',e=>{last=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!last)return;const k=(70*D2R)/innerHeight;
  dragYaw-=(e.clientX-last[0])*k;if(!gyroOn)dragPitch=Math.max(-80*D2R,Math.min(80*D2R,dragPitch+(e.clientY-last[1])*k));last=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',()=>last=null);cv.addEventListener('pointercancel',()=>last=null);
let ht;function hint(t){const h=document.getElementById('hint');h.textContent=t;h.style.opacity=1;clearTimeout(ht);ht=setTimeout(()=>h.style.opacity=0,3500)}
hint('Тяните пальцем или нажмите «Поворот телефоном»');

/* ---------- frame loop ---------- */
const t0=performance.now();
function frame(now){
  const dpr=Math.min(devicePixelRatio||1,1.6),w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}
  qCur=slerp(qCur,target(),gyroOn?.35:.25);
  const asp=w/h,vf=(asp<1?72:52)*D2R;
  gl.uniformMatrix3fv(U.R,false,qmat(qCur));gl.uniform1f(U.tanF,Math.tan(vf/2));gl.uniform1f(U.asp,asp);
  gl.uniform1f(U.T,(now-t0)/1000);
  gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame)}
if(gl)requestAnimationFrame(frame);
window.__look=(yawDeg,pitchDeg)=>{dragYaw=yawDeg*D2R;dragPitch=pitchDeg*D2R;qCur=target()};
</script>
</body>
</html>
